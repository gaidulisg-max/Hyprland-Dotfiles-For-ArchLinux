# ---- Font ----
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        12.0

# ---- Window ----
window_padding_width 12
background_opacity   0.92
confirm_os_window_close 0
hide_window_decorations yes

# ---- Cursor ----
cursor_shape beam
cursor_blink_interval 0.5

# ---- Scrollback ----
scrollback_lines 10000

# ---- Catppuccin Mocha ----
foreground              #CDD6F4
background              #1E1E2E
selection_foreground    #1E1E2E
selection_background    #F5E0DC

cursor                  #F5E0DC
cursor_text_color       #1E1E2E

url_color               #F5E0DC

color0  #45475A
color8  #585B70
color1  #F38BA8
color9  #F38BA8
color2  #A6E3A1
color10 #A6E3A1
color3  #F9E2AF
color11 #F9E2AF
color4  #89B4FA
color12 #89B4FA
color5  #F5C2E7
color13 #F5C2E7
color6  #94E2D5
color14 #94E2D5
color7  #BAC2DE
color15 #A6ADC8

# ---- Misc ----
enable_audio_bell no
allow_remote_control yes
shell_integration enabled
