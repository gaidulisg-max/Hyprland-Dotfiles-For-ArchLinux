background {
    monitor =
    path = ~/Pictures/wallpapers/mocha.png
    blur_passes = 3
    blur_size = 8
    noise = 0.01
    brightness = 0.6
}

general {
    hide_cursor = false
    grace = 0
}

input-field {
    monitor =
    size = 260, 55
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(cba6f7ee)
    inner_color = rgba(1e1e2ecc)
    font_color = rgba(cdd6f4ee)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(cdd6f4ee)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(a6adc8ee)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}
